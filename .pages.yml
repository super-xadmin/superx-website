  - name: source_name_en
    label: ชื่อแหล่งข่าว (เช่น กรุงเทพธุรกิจ) · English
    type: string
  - name: link
    label: ลิงก์ไปหน้าในเว็บนี้ (เว้นว่างได้)
    type: string
    description: เช่น cases.html#tcav หรือ products.html
  - name: link_label_th
    label: ข้อความลิงก์ในเว็บ (เช่น ดูโครงการ) · ไทย
    type: string
  - name: link_label_zh
    label: ข้อความลิงก์ในเว็บ (เช่น ดูโครงการ) · 中文
    type: string
  - name: link_label_en
    label: ข้อความลิงก์ในเว็บ (เช่น ดูโครงการ) · English
    type: string
  view:
    fields:
    - title_th
    - date
    - featured
    - hide
    primary: title_th
    sort:
    - date
    - title_th
    default:
      sort: date
      order: desc
  filename: '{year}-{month}-{day}-{hour}{minute}{second}.json'
