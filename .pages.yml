# Back-office settings for Pages CMS (https://app.pagescms.org).
# This file is generated by build/build.py --cms. Edit the field lists in build/*.py, not here.
media:
- name: images
  label: รูปภาพ
  input: assets/img
  output: /assets/img
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
  - avif
- name: videos
  label: วิดีโอ
  input: assets/video
  output: /assets/video
  extensions:
  - mp4
  - webm
- name: docs
  label: ไฟล์ PDF / โบรชัวร์
  input: assets/docs
  output: /assets/docs
  extensions:
  - pdf
- name: models3d
  label: ไฟล์ 3D (.glb)
  input: assets/3d
  output: /assets/3d
  extensions:
  - glb
  - gltf
content:
- name: news
  label: 📰 ข่าวสาร (เพิ่มข่าวใหม่ที่นี่)
  type: collection
  path: content/news
  format: json
  fields:
  - name: title_th
    label: หัวข้อข่าว · ไทย
    type: string
    required: true
  - name: title_zh
    label: หัวข้อข่าว · 中文
    type: string
  - name: title_en
    label: หัวข้อข่าว · English
    type: string
  - name: date
    label: วันที่ของข่าว
    type: date
    options:
      format: yyyy-MM-dd
    description: ข่าวเรียงจากวันที่ใหม่ที่สุดก่อน
  - name: date_show
    label: แสดงวันที่แบบ
    type: select
    options:
      values:
      - name: day
        label: วัน เดือน ปี (เช่น 14 ก.ย. 2569)
      - name: month
        label: เดือน ปี (เช่น ก.ย. 2569)
      - name: year
        label: ปีอย่างเดียว (เช่น 2569)
  - name: category
    label: ประเภทข่าว
    type: select
    options:
      values:
      - name: company
        label: ข่าวบริษัท
      - name: partner
        label: ข่าวพันธมิตร
      - name: project
        label: โครงการ / ผลงาน
      - name: event
        label: กิจกรรม / งานแสดงสินค้า
      - name: press
        label: สื่อมวลชน
  - name: featured
    label: ข่าวเด่น (แสดงใหญ่ด้านบนสุดของหน้าข่าว)
    type: boolean
    description: ถ้าเลือกไว้หลายข่าว จะแสดงข่าวที่วันที่ใหม่ที่สุด
  - name: hide
    label: ซ่อนข่าวนี้ (ยังไม่แสดงบนเว็บ)
    type: boolean
  - name: summary_th
    label: สรุปข่าวสั้นๆ (แสดงในรายการข่าว) · ไทย
    type: text
  - name: summary_zh
    label: สรุปข่าวสั้นๆ (แสดงในรายการข่าว) · 中文
    type: text
  - name: summary_en
    label: สรุปข่าวสั้นๆ (แสดงในรายการข่าว) · English
    type: text
  - name: image
    label: รูปหลักของข่าว
    type: image
    options:
      media: images
  - name: alt
    label: คำอธิบายรูป (alt)
    type: string
    description: ภาษาอังกฤษสั้นๆ บอกว่าในรูปมีอะไร ช่วยเรื่อง Google และผู้พิการทางสายตา
  - name: body_th
    label: เนื้อหาข่าวฉบับเต็ม (ถ้าใส่ เว็บจะสร้างหน้าอ่านข่าวให้อัตโนมัติ) · ไทย
    type: rich-text
    options:
      format: html
      media: images
  - name: body_zh
    label: เนื้อหาข่าวฉบับเต็ม (ถ้าใส่ เว็บจะสร้างหน้าอ่านข่าวให้อัตโนมัติ) · 中文
    type: rich-text
    options:
      format: html
      media: images
  - name: body_en
    label: เนื้อหาข่าวฉบับเต็ม (ถ้าใส่ เว็บจะสร้างหน้าอ่านข่าวให้อัตโนมัติ) · English
    type: rich-text
    options:
      format: html
      media: images
  - name: gallery
    label: รูปเพิ่มเติม (แสดงในหน้าอ่านข่าว)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{alt}'
    fields:
    - name: image
      label: รูปภาพ
      type: image
      options:
        media: images
    - name: alt
      label: คำอธิบายรูป (alt)
      type: string
      description: ภาษาอังกฤษสั้นๆ บอกว่าในรูปมีอะไร ช่วยเรื่อง Google และผู้พิการทางสายตา
    - name: caption_th
      label: คำบรรยาย (เว้นว่างได้) · ไทย
      type: string
    - name: caption_zh
      label: คำบรรยาย (เว้นว่างได้) · 中文
      type: string
    - name: caption_en
      label: คำบรรยาย (เว้นว่างได้) · English
      type: string
  - name: video
    label: วิดีโอ (แสดงในหน้าอ่านข่าว) เว้นว่างได้
    type: file
    options:
      media: videos
      extensions:
      - mp4
      - webm
  - name: poster
    label: ภาพก่อนกดเล่นวิดีโอ
    type: image
    options:
      media: images
  - name: source_url
    label: ลิงก์ข่าวต้นฉบับ (เว็บไซต์ภายนอก) เว้นว่างได้
    type: string
    description: เช่น https://www.bangkokbiznews.com/...
  - name: source_name_th
    label: ชื่อแหล่งข่าว (เช่น กรุงเทพธุรกิจ) · ไทย
    type: string
  - name: source_name_zh
    label: ชื่อแหล่งข่าว (เช่น กรุงเทพธุรกิจ) · 中文
